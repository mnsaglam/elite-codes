name: C++

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cxx: g++
          - name: Clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Compile and run every C++ file
        env:
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' sources < <(git ls-files -z -- '*.cpp')
          if (( ${#sources[@]} == 0 )); then
            echo 'No checked-in .cpp files found.'
            exit 1
          fi

          build_dir="$RUNNER_TEMP/cpp-tests"
          "$CXX" --version
          for source in "${sources[@]}"; do
            binary="$build_dir/${source%.cpp}"
            mkdir -p "$(dirname "$binary")"

            echo "Compiling $source with $CXX"
            "$CXX" -std=c++23 -Wall -O3 "$source" -o "$binary"

            echo "Running $source"
            "$binary"
          done
